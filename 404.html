<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>404 · 考研真题精讲</title>
<style>
body{font-family:system-ui,"Segoe UI","Microsoft YaHei",sans-serif;background:#FAF8F4;color:#1e293b;display:flex;align-items:center;justify-content:center;min-height:100vh;margin:0;padding:20px}
.box{background:#fff;border-radius:14px;box-shadow:0 8px 26px rgba(15,37,64,.14);padding:36px 40px;max-width:460px;text-align:center}
h1{font-size:44px;margin:0;color:#0F2540}
p{color:#64748b;font-size:14px;line-height:1.9}
a.btn,button{display:inline-block;margin:14px 6px 0;padding:10px 22px;border-radius:20px;border:1px solid #0F2540;background:#fff;color:#0F2540;font:inherit;font-size:14px;cursor:pointer;text-decoration:none}
a.btn.pri,button.pri{background:#0F2540;color:#fff}
code{font-size:12px;color:#94a3b8;word-break:break-all}
</style>
</head>
<body>
<div class="box">
  <h1>404</h1>
  <p>这个地址不存在，或文件未发布。</p>
  <p id="hashline" style="display:none">看起来你要找的是站内题目页：<code id="hashval"></code><br>点下面按钮可带着定位回到站点。</p>
  <a class="btn pri" href="index.html">进入站点</a>
  <button id="goHash" style="display:none" type="button">带定位进入</button>
</div>
<script>
var h=location.hash;
if(h&&h.length>1){document.getElementById("hashline").style.display="";
document.getElementById("hashval").textContent=h.slice(0,80);
var b=document.getElementById("goHash");b.style.display="";
b.onclick=function(){location.replace("index.html"+h)};}
</script>
</body>
</html>
