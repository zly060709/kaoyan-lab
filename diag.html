<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>自诊断 · 考研全栈学习平台</title>
<style>
body{font-family:"Microsoft YaHei",sans-serif;background:#FAF8F4;color:#1e293b;max-width:820px;margin:0 auto;padding:24px;line-height:1.8}
h1{font-size:20px;color:#0F2540}h2{font-size:16px;color:#0F2540;margin:18px 0 8px}
table{border-collapse:collapse;width:100%;background:#fff;font-size:14px}
td,th{border:1px solid #e2e8f0;padding:6px 10px;text-align:left}
th{background:#e8f0fe}
.ok{color:#2e7d32;font-weight:700}.bad{color:#c62828;font-weight:700}
pre{background:#0F2540;color:#e2e8f0;padding:12px;border-radius:8px;font-size:12px;overflow:auto;white-space:pre-wrap}
button{padding:6px 16px;border-radius:8px;border:1px solid #0F2540;background:#fff;cursor:pointer}
</style></head>
<body>
<h1>🔧 自诊断</h1>
<p>数据版本、题数核对、缓存与错误日志。学习数据仅存浏览器本地。</p>
<h2>题库迁移状态</h2><div id="tbl">加载中…</div>
<h2>最近脚本错误（本机最近 10 条）</h2><div id="errs">（无）</div>
<h2>诊断信息</h2><pre id="diag">…</pre>
<button onclick="navigator.clipboard&&navigator.clipboard.writeText(document.getElementById('diag').textContent)">一键复制诊断信息</button>
<a href="index.html" style="margin-left:10px">← 返回首页</a>
<script>
"use strict";
const EXPECT={politics:456,math:250,english:675,cs408:376};
const errs=JSON.parse(localStorage.getItem("kaoyan_errlog")||"[]");
document.getElementById("errs").innerHTML=errs.length?("<table>"+errs.map(e=>"<tr><td>"+e+"</td></tr>").join("")+"</table>"):"（无）";
window.addEventListener("error",e=>{try{const a=JSON.parse(localStorage.getItem("kaoyan_errlog")||"[]");a.unshift(new Date().toISOString()+" "+e.message);localStorage.setItem("kaoyan_errlog",JSON.stringify(a.slice(0,10)))}catch(_){}});
(async()=>{
  let rows="",ok=true;
  for(const[s,exp]of Object.entries(EXPECT)){
    let n=0,st="",files=0;
    try{const m=await fetch("data/meta/migration_"+s+".json").then(r=>r.json());n=m.actual_total??m.actual_objective??0;files=Object.keys(m.per_year||m.per_year_objective||{}).length}catch(_){st="无报告"}
    const pass=n===exp&&!st;if(!pass)ok=false;
    rows+=`<tr><td>${s}</td><td>${exp}</td><td class="${pass?"ok":"bad"}">${n||"—"}${st?"（"+st+"）":""}</td><td>${files} 年</td></tr>`;
  }
  document.getElementById("tbl").innerHTML=`<table><tr><th>科目</th><th>基准</th><th>已迁移</th><th>年份数</th></tr>${rows}</table>
  <p class="${ok?"ok":"bad"}">${ok?"全部达标":"未达标：迁移仍在进行或存在缺口"}</p>`;
  document.getElementById("diag").textContent=JSON.stringify({ua:navigator.userAgent,lang:navigator.language,online:navigator.onLine,hash:location.href,ts:new Date().toISOString()},null,2);
})();
</script>
</body>
</html>
