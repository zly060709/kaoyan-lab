<script>
"use strict";
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let REG=null,CACHE={},toastTimer=null,keyHandler=null;
const app=$("#app");
function toast(m){const t=$("#toast");t.textContent=m;t.style.display="block";clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.style.display="none",2600)}
window.onerror=function(m){const e=$("#errbar");e.style.display="block";e.textContent="⚠ 脚本错误："+m+"（其他模块不受影响，详见 /diag.html）";setTimeout(()=>e.style.display="none",6000)};
async function fetchJSON(url){
  if(CACHE[url])return CACHE[url];
  const ac=new AbortController();const tid=setTimeout(()=>ac.abort(),8000);
  try{const r=await fetch(url,{signal:ac.signal});if(!r.ok)throw new Error("HTTP "+r.status);const j=await r.json();CACHE[url]=j;return j}
  finally{clearTimeout(tid)}
}
function ls(k,v){try{if(v===undefined)return localStorage.getItem(k);localStorage.setItem(k,v)}catch(e){return null}}
async function fetchShard(url){
  /* 合同第 6 章：单文件 ≤500KB。指针文件用 parts 列出子片，这里合并后回写缓存。 */
  const j=await fetchJSON(url);
  if(!j||!Array.isArray(j.parts)||!j.parts.length)return j;
  const base=url.slice(0,url.lastIndexOf("/")+1);
  const ps=[];for(const p of j.parts){try{ps.push(await fetchJSON(base+p))}catch(e){}}
  let merged;
  if(j.items!==undefined){const m={};ps.forEach(x=>Object.assign(m,x.items||{}));merged=Object.assign({},j,{items:Object.assign(m,{}),parts:null})}
  else{let a=(j.analysis||[]).slice();ps.forEach(x=>a=a.concat(x.analysis||[]));merged=Object.assign({},j,{analysis:a,parts:null})}
  CACHE[url]=merged;return merged;
}
function subjById(id){return (REG&&REG.subjects||[]).find(s=>s.id===id)}
function dirOf(id){const s=subjById(id);return (s&&s.dataDir)||id}
// 影像清单键前缀与题目目录名不同名（数一题目在 data/math、影像前缀是 math1.pages），
// 原先两处各用 dirOf 猜，猜不中就在科目页已列出该卷的情况下渲染「未入库」。前缀真值取注册表 paperDir。
function paperKeysOf(man,id,y){
  if(!man)return [];const s=subjById(id)||{};
  const pats=[s.paperDir,s.dataDir,id].filter(Boolean);
  return Object.keys(man).filter(k=>k.endsWith(":"+y)&&pats.some(p=>k.startsWith(p+":")));
}
let _kt=0;

}

/* ============ 数学图形引擎（D043 DSL，白名单表达式，禁外部输入拼接） ============ */
function compileExpr(src){
  const cleaned=String(src||"").replace(/\s+/g,"");
  if(!cleaned)throw new Error("空表达式");
  if(!/^[0-9a-zA-Z_+\-*/^(),.]+$/.test(cleaned))throw new Error("表达式含非法字符");
  const FN={sin:"Math.sin",cos:"Math.cos",tan:"Math.tan",asin:"Math.asin",acos:"Math.acos",atan:"Math.atan",
    sinh:"Math.sinh",cosh:"Math.cosh",tanh:"Math.tanh",ln:"Math.log",log:"Math.log",log10:"Math.log10",

  if(xlim[0]<=0&&xlim[1]>=0){ctx.beginPath();ctx.moveTo(px(0),py(ylim[0]));ctx.lineTo(px(0),py(ylim[1]));ctx.stroke();}
  ctx.fillStyle="#94a3b8";ctx.font="10px sans-serif";ctx.textAlign="center";
  for(let i=0;i<=10;i+=2){const x=xlim[0]+gx*i;if(Math.abs(x)>1e-9)ctx.fillText(String(+x.toFixed(2)),px(x),H-12);}
  ctx.textAlign="right";
  for(let i=0;i<=8;i+=2){const y=ylim[0]+gy*i;if(Math.abs(y)>1e-9)ctx.fillText(String(+y.toFixed(2)),38,py(y)+3);}

    const N=700,span=xlim[1]-xlim[0];

      case "shade_between":fillBetween(it.f1,it.f2,+(it.domain?it.domain[0]:xlim[0]),+(it.domain?it.domain[1]:xlim[1]),it.color||"rgba(29,78,216,.18)");break;
      case "shade_under":fillBetween(it.f,"0",+(it.domain?it.domain[0]:xlim[0]),+(it.domain?it.domain[1]:xlim[1]),it.color||"rgba(29,78,216,.18)");break;

        if(it.label){ctx.fillStyle="#334155";ctx.font="12px sans-serif";ctx.textAlign="left";ctx.fillText(it.label,px(+it.x)+4,py(ylim[1])+12)}break}
      case "hline":{ctx.strokeStyle=col||"#94a3b8";ctx.setLineDash(it.style==="dashed"?[5,4]:[]);ctx.beginPath();

}

/* ============ 路由 ============ */
function routeViews(){
  const p=location.hash.replace(/^#\/?/,"").split("/").filter(Boolean);
  window.scrollTo(0,0);keyHandler=null;
  if(!REG){app.innerHTML="<div class='qcard'>加载科目注册表…</div>";return}
  if(p.length===0)return viewHome();
  if(p[0]==="search")return viewSearch(decodeURIComponent(p[1]||""));
  const s=subjById(p[0]);
  if(!s||s.status==="pending")return view404();
  if(p.length===1)return viewSubject(s);
  const year=parseInt(p[1],10);
  if(!year)return view404();
  if(p[2]==="q")return viewQuestion(s,year,parseInt(p[3]||"1",10));
  if(p[2]==="paper")return viewPaper(s,year);
  return viewYear(s,year);
}
function route(){const r=routeViews();Promise.resolve(r).then(()=>renderMath(app));return r}
addEventListener("hashchange",route);

const TYPE_LABEL={single:"单选",multi:"多选",fill:"填空",essay:"解答",analysis:"分析题",reading:"阅读",cloze:"完形",partb:"新题型",translation:"翻译",writing:"写作",code:"代码",big:"大题",sufficiency:"条件充分性判断",logic:"逻辑推理",other:"题"};

/* ============ 九段式分步揭示（合同第 3 章 B，扩展精讲 origin=extended） ============ */
const STEPS=[["考点定位","kaodian"],["先补基础","basis"],["审题抓条件","read"],["思路引导","silu"],
  ["关键一步","key"],["完整推导","derive"],["为什么不选其他","why"],["易错深挖","yicuo"],["举一反三","fan"]];
const STEP_MARK=["①","②","③","④","⑤","⑥","⑦","⑧","⑨"];
const STEP_ALIAS={"书写套路/评分点":"derive","书写套路":"derive","方法归纳":"yicuo","其他解法":"fan",
  "解法构建":"key","标准解答":"derive","易错提醒":"yicuo","逐项解析":"why","详细解析":"derive","怎么想":"silu"};
function buildSteps(ana){
  if(!ana||!Array.isArray(ana.nodes)||!ana.nodes.length)return "";
  const bucket={},order=[];let last="derive";
  ana.nodes.forEach(n=>{
    const lb=n.label?String(n.label).trim():null;
    let key=null;
    if(lb){const hit=STEPS.find(x=>x[0]===lb);key=hit?hit[1]:(STEP_ALIAS[lb]||null)}
    if(!key)key=last;else if(!bucket[key])last=key;
    if(!bucket[key]){bucket[key]=[];order.push(key)}
    (n.lines||[]).forEach(l=>bucket[key].push(String(l)));
  });
  const present=STEPS.filter(x=>bucket[x[1]]&&bucket[x[1]].length);
  if(!present.length)return "";
  const idx=k=>STEPS.findIndex(x=>x[1]===k);
  const row=present.map(x=>`<button class="stp" data-k="${x[1]}">${STEP_MARK[idx(x[1])]} ${esc(x[0])}</button>`).join("");
  const body=present.map(x=>`<div class="step" data-k="${x[1]}"><span class="lab">${STEP_MARK[idx(x[1])]} ${esc(x[0])}</span>`+
    bucket[x[1]].map(l=>`<p>${esc(l)}</p>`).join("")+`</div>`).join("");
  return `<div class="steps" id="steps"><div class="sthd"><b>扩展精讲 · 九段式分步揭示</b><span class="org">非原文</span>`+
    `<span class="stct">已揭示 <b id="stn">0</b>/${present.length}</span>`+
    `<button class="stp all" id="stall">全部揭示</button></div><div class="strow">${row}</div>${body}`+
    (ana.desc?`<div class="stnote">一句话要点：${esc(ana.desc)}</div>`:"")+`</div>`;
}

/* ============ 题目页 ============ */
function optLetter(o){const s=String(o);const m=s.match(/^\s*(?:\[?([A-H])\]?|[（(]([A-H])[）)]|([A-H])[\.、\s])/);return m?(m[1]||m[2]||m[3]):null}
async function viewQuestion(s,y,num){
  let d;try{d=await fetchJSON(`data/${dirOf(s.id)}/${y}.json`)}catch(e){app.innerHTML=`<div class="qcard">加载失败：${esc(e.message)}</div>`;return}
  const qs=d.questions||[];const idx=qs.findIndex(q=>q.num===num);
  if(idx<0){app.innerHTML=`<div class="qcard">未找到第 ${num} 题。<a href="#/${s.id}/${y}">返回列表</a></div>`;return}
  const q=qs[idx];
  let mediaMap=null;
  const raw=JSON.stringify(q);
  if(raw.includes("@@M:")){try{mediaMap=(await fetchShard(`data/${dirOf(s.id)}/${y}.media.json`)).items||{}}catch(e){}}
  let ana=null;
  if((s.analysisYears||[]).includes(y))
  try{const ad=await fetchShard(`data/${dirOf(s.id)}/${y}.analysis.json`);
    ana=(ad.analysis||[]).find(a=>a.id===q.id)||null}catch(e){}
  const fill=t=>String(t??"").replace(/@@M:([-\w]+):(\d+)@@/g,(m0,id,i)=>{
    const uri=mediaMap&&mediaMap[id]&&mediaMap[id][i];
    return uri?`<img src="${uri}" alt="题目图片" loading="lazy" class="mimg">`:m0;});
  const fillText=t=>String(t??"").split(/(@@M:[-\w]+:\d+@@)/g).map(seg=>{
    const m=seg.match(/^@@M:([-\w]+):(\d+)@@$/);
    if(!m)return esc(seg);
    const uri=mediaMap&&mediaMap[m[1]]&&mediaMap[m[1]][m[2]];
    return uri?`<img src="${uri}" alt="题目图片" loading="lazy" class="mimg">`:esc(seg);
  }).join("");
  const ansStr=q.answer==null?"":(typeof q.answer==="object"?JSON.stringify(q.answer):String(q.answer));
  // 答案里的中日韩片段包进 \text{…}：可见文字不变，但整条能被 KaTeX 渲染（此前 21 条混排答案退回裸 LaTeX）
  const texAns=s=>{let out="",last=0,m;const re=/\\(?:text|mathrm|operatorname|mathbf|boldsymbol|mathit)\{[^{}]*\}/g;
    const seg=x=>{out+=x.replace(/[\u3000-\u303f\u3400-\u9fff\uff00-\uffef]+/g,y=>"\\text{"+y+"}")};
    while((m=re.exec(s))){seg(s.slice(last,m.index));out+=m[0];last=m.index+m[0].length}
    seg(s.slice(last));return out};
  const mathAns=/\\[a-zA-Z]+/.test(ansStr)&&ansStr.indexOf("$")<0;
  const correct=new Set((ansStr.match(/[A-H]/g)||[]));
  const optArr=q.options||[];
  // 408 原卷选项是纯值（无 [A] 标签）：整列都无标签时按位置推断字母，与数据层 D037 口径一致
  const positional=optArr.length>0&&!optArr.some(o=>optLetter(typeof o==="object"?JSON.stringify(o):String(o)));
  const opts=optArr.map((o,i)=>{
    const obj=typeof o==="object"?JSON.stringify(o):String(o);
    const L=positional?String.fromCharCode(65+i):optLetter(obj);
    const shown=positional?`${L}. ${obj}`:obj;
    return `<div class="opt${L&&correct.has(L)?" correct":""}">${fillText(shown)}</div>`;}).join("");
  const nodeBlock=txt=>{
    if(typeof txt!=="string"||txt.trim().charAt(0)!=="[")return null;
    let arr;try{arr=JSON.parse(txt)}catch(e){return null}
    if(!Array.isArray(arr)||!arr.length||!arr.every(n=>n&&typeof n==="object"))return null;
    return arr.map(n=>{
      const lines=(n.lines||[]).map(l=>esc(String(l))).join("<br>");
      if(n.type==="code")return `<pre class="ndcode">${(n.lines||[]).map(l=>esc(String(l))).join("\n")}</pre>`;
      const lab=n.label?`<b class="ndl">${esc(String(n.label))}</b> `:"";
      return `<div class="nd">${lab}${lines}</div>`;
    }).join("");
  };
  const blocks=(q.source_blocks||[]).map(b=>{
    const role=ROLE_L[b.role]?b.role:"other";
    const body=b.html?fill(b.html):(nodeBlock(b.text)||fillText(b.text||""));
    const org=b.origin&&b.origin!=="source"?`<span class="org">${b.origin==="extended"?"扩展精讲":"变式"}</span>`:"";
    return `<div class="blk" data-role="${role}"><span class="lab">${ROLE_L[role]}</span>${org}${body}</div>`;}).join("");
  const mark=ls("bm:"+q.id)==="1";
  app.innerHTML=`<div class="crumb"><a href="#/">首页</a> › <a href="#/${s.id}">${esc(s.short||s.name)}</a> › <a href="#/${s.id}/${y}">${y}</a> › 第 ${q.num} 题</div>
  <article id="qart"><div class="qcard" style="--acc:${s.color}">
    <div class="qhead"><div class="qn">${q.num}</div>
      <div class="tt">${esc(q.title||(s.short+" "+y+" 第 "+q.num+" 题"))}</div>
      ${(q.tags||[]).map(t=>`<span style="font-size:11px;color:var(--muted);border:1px solid var(--line);padding:1px 8px;border-radius:10px">${esc(t)}</span>`).join("")}
      ${q.difficulty?`<span style="font-size:11px;color:var(--amber)">难度 ${"★".repeat(q.difficulty)}${"☆".repeat(5-q.difficulty)}</span>`:""}
      ${q.score?`<span style="font-size:11px;color:var(--muted)">${q.score} 分</span>`:""}
      ${ansStr?`<div class="ans">答案 <b>${mathAns?"$"+esc(texAns(ansStr))+"$":esc(ansStr)}</b></div>`:""}
      <button class="reveal-btn" id="rv" style="margin:0 0 0 8px;padding:4px 14px;font-size:12.5px">👁 揭示</button>
      <button class="reveal-btn" id="bm" style="margin:0;padding:4px 14px;font-size:12.5px">${mark?"★ 已收藏":"☆ 收藏"}</button>
    </div>
    ${q.stem?`<div class="stem">${fillText(q.stem)}</div>`:""}
    ${opts?`<div class="opts">${opts}</div>`:""}
    <div id="figs"></div>
    ${blocks||'<div class="blk" data-role="other">（本题解析迁移中）</div>'}
    ${buildSteps(ana)}
    <div style="font-size:12px;color:var(--muted)">来源：${esc((q.source_ref&&q.source_ref.pdf)||q.source_ref&&q.source_ref.file||"legacy")} · ${esc((q.source_ref&&q.source_ref.anchor)||"")} · ${esc(String(q.source_hash||"").slice(0,24))}…</div>
  </div></article>
  <div class="qnav">
    <button id="prev">‹ 上一题 (j)</button><button id="rand">🎲 随机一题</button><button id="next">下一题 (k) ›</button>
  </div>`;
  $("#rv").onclick=()=>$("#qart").classList.toggle("revealed");
  $("#bm").onclick=e=>{const k="bm:"+q.id;const v=ls(k)==="1"?"0":"1";ls(k,v);e.target.textContent=v==="1"?"★ 已收藏":"☆ 收藏"};
  const go=n=>{location.hash=`#/${s.id}/${y}/q/${n}`};
  $("#prev").onclick=()=>idx>0&&go(qs[idx-1].num);
  $("#next").onclick=()=>idx<qs.length-1&&go(qs[idx+1].num);
  $("#rand").onclick=()=>go(qs[Math.floor(Math.random()*qs.length)].num);
  onkeys(e=>{
    if(e.key==="j"&&idx>0)go(qs[idx-1].num);
    if(e.key==="k"&&idx<qs.length-1)go(qs[idx+1].num);
    if(e.key===" "){e.preventDefault();$("#qart").classList.toggle("revealed")}
  });
  const stBox=$("#steps");
  if(stBox){
    const total=stBox.querySelectorAll(".step").length;
    const upd=()=>{const n=$("#stn");if(n)n.textContent=stBox.querySelectorAll(".step.on").length};
    stBox.querySelectorAll(".stp[data-k]").forEach(b=>b.onclick=()=>{
      const el=stBox.querySelector('.step[data-k="'+b.dataset.k+'"]');
      if(!el)return;
      const on=el.classList.toggle("on");b.classList.toggle("on",on);
      if(on)ls("hint:"+q.id,(+(ls("hint:"+q.id)||0)+1));
      upd();
    });
    const all=$("#stall");
    if(all)all.onclick=()=>{
      stBox.querySelectorAll(".step").forEach(e=>e.classList.add("on"));
      stBox.querySelectorAll(".stp[data-k]").forEach(e=>e.classList.add("on"));
      ls("hint:"+q.id,(+(ls("hint:"+q.id)||0)+total));upd();
    };
  }
  renderMath(app);
  app.querySelectorAll(".mimg,.blk img").forEach(img=>img.onclick=()=>lightbox(img.currentSrc||img.src));
  // 图形面板（D043）：只请求注册表登记在册的年份，缺图年份不发请求（避免题页 404）
  const figYears = s.figureYears || []
  if (figYears.includes(y)) loadFigures(s.id,y,q.id).then(figs=>{
    if(!figs.length)return;
    const box=document.createElement("div");
    box.innerHTML=figs.map((f,i)=>`<div class="figbox" id="fig${i}"><h4>📐 ${esc(f.title||"题目图形")}<span class="derv">扩展图形 · 非原卷</span></h4></div>`).join("");
    $("#figs").appendChild(box);
    figs.forEach((f,i)=>renderFigure($("#fig"+i),f));
    renderMath(box);
  });
}
const ROLE_L={stem:"题目原文",material:"材料",answer:"正确答案",approach:"解题思路",think:"考场思路",analysis:"详细解析",analysis2:"点评",detail:"逐项解析",background:"背景知识",qa:"师生问答",frame:"背诵框架",vocab:"词汇释义",warn:"易错提醒",nodes:"七步法解析",desc:"解析",solution:"解答",kaodian:"考点定位",silu:"思路引导",jiefa:"解法构建",biaozhun:"标准解答",yicuo:"易错深挖",guina:"方法归纳",qita:"其他解法",stem_nodes:"题干结构化原文",options:"选项原文",paper_slice:"原卷切片",note:"源包校注",other:"原文区块"};

/* ============ 搜索 ============ */
async function viewSearch(q){
  const act=REG.subjects.filter(s=>s.status!=="pending");
  let sel=(ls("searchSids")||"").split(",").filter(x=>subjById(x)&&subjById(x).status!=="pending");
  if(!sel.length)sel=act.map(s=>s.id);
  app.innerHTML=`<div class="crumb"><a href="#/">首页</a> › 搜索</div>
  <div class="searchbar" style="margin:10px 0 4px"><input id="q2" value="${esc(q)}" placeholder="输入关键词…（题干/解析/考点）"><button id="go2">搜索</button></div>
  <div class="chips">${act.map(s=>`<button class="chip${sel.includes(s.id)?" on":""}" data-sid="${s.id}" style="--acc:${s.color}">${esc(s.short||s.name)}</button>`).join("")}</div>
  <div id="res"><div class="qcard">输入关键词开始搜索…</div></div>`;
  $("#go2").onclick=()=>{const v=$("#q2").value.trim();location.hash="#/search/"+encodeURIComponent(v)};
  $("#q2").onkeydown=e=>{if(e.key==="Enter")$("#go2").click()};
  app.querySelectorAll(".chip").forEach(ch=>ch.onclick=()=>{
    const id=ch.dataset.sid;sel=sel.includes(id)?sel.filter(x=>x!==id):sel.concat(id);
    ls("searchSids",sel.join(","));ch.classList.toggle("on");if(q)run();
  });
  async function run(){
    const res=$("#res");res.innerHTML="<div class='qcard'>检索中…</div>";
    const kw=q.toLowerCase();const out=[];
    for(const sid of sel){
      try{
        const mf=await fetchJSON(`data/index/${sid}.manifest.json`);
        const years=Object.keys(mf.shards||{});
        const parts=await Promise.all(years.map(y=>fetchJSON(`data/index/${sid}/${y}.json`).catch(()=>null)));
        parts.forEach(p=>p&&p.entries&&out.push(...p.entries));
      }catch(e){}
    }
    const hits=out.filter(e=>!kw||(e.title||"").toLowerCase().includes(kw)||(e.text||"").toLowerCase().includes(kw)).slice(0,80);
    if(!hits.length){res.innerHTML="<div class='qcard'>无结果。换个关键词试试。</div>";return}
    const hl=t=>{t=prevText(String(t||""),160);let i=t.toLowerCase().indexOf(kw);
      if(kw&&i>=0){const a=Math.max(0,i-40);t=t.slice(a)}
      // 搜索摘要兜底（D104，覆盖收敛⑭b bal() 未覆盖的 $ 外残片）：索引截断可能把 LaTeX 切在 $ 外；清洗 $ 外残片，$ 内交 KaTeX
      t=t.split("$").map((seg,idx)=>idx%2===0?seg.replace(/\\(?:begin|end)\{[a-zA-Z*]+\}/g," ").replace(/\\[a-zA-Z]+/g," ").replace(/[{}]/g,""):seg).join("$");
      i=t.toLowerCase().indexOf(kw);
      if(kw&&i>=0){const a=Math.max(0,i-30);return (a>0?"…":"")+esc(t.slice(a,i))+"<mark>"+esc(t.slice(i,i+kw.length))+"</mark>"+esc(t.slice(i+kw.length,i+kw.length+110))}return esc(t.slice(0,140))};
    res.innerHTML=hits.map(e=>{
      const s=subjById(e.sid);const snippet=hl(e.text||e.title);
      return `<a class="sr" style="--acc:${s?s.color:"#999"}" href="#/${e.sid}/${e.year}/q/${e.num}">
        <div class="h">${esc(s?s.short:e.sid)} ${e.year} 第 ${e.num} 题 <span style="font-weight:400;font-size:12px;color:var(--muted)">${esc(TYPE_LABEL[e.type]||"")}</span></div>
        <div class="m">${snippet}</div></a>`;}).join("");
    // 结果是异步注入的，晚于路由层的统一渲染收尾，不补一次就把 $…$ 当纯文本印出来
    renderMath(res);
  }
  if(q)run();
}
