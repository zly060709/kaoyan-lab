/* ========== 设计令牌（C03/C05/C04）：唯一变量源，暗色模式由 html.dark 切换 ========== */
:root{
  --navy:#0F2540; --navy-mid:#1a3a5c; --gold:#C9A961; --gold-l:#e8d5a3;
  --bg:#FAF8F4; --surface:#ffffff; --surface-2:#f1f5f9; --surface-3:#e7edf4;
  --text:#1e293b; --muted:#52627a; --border:#e2e8f0;
  --ok:#1F7A6D; --info:#1a3a5c; --warn:#92600a; --bad:#b8324a;
  --radius:14px; --radius-s:10px;
  --shadow:0 2px 12px rgba(15,37,64,.08); --shadow-l:0 8px 26px rgba(15,37,64,.14);
  --dur:180ms;
  --font-ui:system-ui,-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
  --font-read:Georgia,"Times New Roman","Songti SC","SimSun","Noto Serif SC",serif;
  --math:#1D4ED8; --ink:#1e293b;
}
html.dark{
  --bg:#0e141f; --surface:#161e2c; --surface-2:#1c2534; --surface-3:#232f42;
  --text:#e6ebf3; --muted:#9aa8bf; --border:#2b3a52;
  --ok:#4cc2ae; --info:#8fb4e8; --warn:#e0a63f; --bad:#e0798d; --gold-l:#8a7a4e;
  --shadow:0 2px 12px rgba(0,0,0,.4); --shadow-l:0 8px 26px rgba(0,0,0,.5);
  --ink:#e6ebf3;
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{font-family:var(--font-ui);background:var(--bg);color:var(--text);line-height:1.9;font-size:16px;-webkit-text-size-adjust:100%}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px;border-radius:6px}
.skip{position:absolute;left:-999px;top:0;background:var(--navy);color:#fff;padding:8px 16px;z-index:1001;border-radius:0 0 8px 0}
.skip:focus{left:0}
.wrap{max-width:960px;margin:0 auto;padding:0 20px 80px;padding-left:max(20px,env(safe-area-inset-left));padding-right:max(20px,env(safe-area-inset-right))}
.errbar{position:fixed;top:0;left:0;right:0;background:var(--bad);color:#fff;font-size:12.5px;padding:5px 12px;z-index:1000;display:none}
header.top{position:sticky;top:0;z-index:100;background:linear-gradient(135deg,var(--navy),var(--navy-mid));color:#fff;box-shadow:0 2px 14px rgba(15,37,64,.3)}
header.top .bar{max-width:960px;margin:0 auto;display:flex;align-items:center;gap:10px;padding:10px 20px;padding-left:max(20px,env(safe-area-inset-left));padding-right:max(20px,env(safe-area-inset-right))}
header.top .logo{width:32px;height:32px;border-radius:9px;background:var(--gold);display:flex;align-items:center;justify-content:center;font-size:17px;flex-shrink:0}
header.top .t{font-weight:800;font-size:15px;letter-spacing:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
header.top .bar select{max-width:120px;background:rgba(255,255,255,.12);color:#fff;border:1px solid rgba(255,255,255,.25);border-radius:8px;padding:4px 6px;font-size:12.5px;font-family:inherit}
header.top .bar select option{color:#1e293b}
.hbtn{font:inherit;font-size:12.5px;color:#fff;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.25);border-radius:8px;padding:4px 10px;cursor:pointer;text-decoration:none;white-space:nowrap}
.hbtn:hover{background:rgba(255,255,255,.24)}
header.top .right{margin-left:auto;display:flex;align-items:center;gap:8px;font-size:12.5px;flex-shrink:0}
.switch{width:44px;height:24px;border-radius:12px;background:rgba(255,255,255,.25);position:relative;cursor:pointer;transition:background var(--dur);flex-shrink:0;border:none;padding:0}
.switch[aria-checked="true"]{background:var(--gold)}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:transform var(--dur)}
.switch[aria-checked="true"]::after{transform:translateX(20px)}
.crumb{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:13.5px;color:var(--muted);padding:14px 0 0}
.crumb a{color:var(--navy);text-decoration:none}
html.dark .crumb a{color:var(--gold-l)}
.crumb a:hover{text-decoration:underline}
.hero{position:relative;background:linear-gradient(160deg,#0F2540 0%,#1a3a5c 55%,#2c5282 100%);color:#fff;padding:34px 28px 44px;text-align:center;overflow:hidden;border-radius:0 0 18px 18px}
.hero::before{content:"";position:absolute;top:-50%;right:-20%;width:480px;height:480px;background:radial-gradient(circle,rgba(201,169,97,.18) 0%,transparent 70%);border-radius:50%}
.hero h1{font-size:26px;font-weight:900;letter-spacing:2px;position:relative}
.hero .sub{opacity:.85;letter-spacing:3px;font-size:13px;margin-top:6px;position:relative}
.hero .gold{width:60px;height:3px;background:var(--gold);margin:14px auto;position:relative}
.hero .cd{display:inline-block;background:rgba(255,255,255,.12);border:1px solid rgba(201,169,97,.5);border-radius:12px;padding:7px 18px;font-size:13.5px;position:relative;cursor:pointer;margin-bottom:12px}
.hero .cd b{font-size:19px;color:var(--gold-l);font-family:Georgia,serif}
.hero .ctas{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:0 0 12px;position:relative}
.hero .ctas a,.hero .ctas button{font:inherit;font-size:13.5px;color:#fff;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.35);border-radius:18px;padding:7px 18px;cursor:pointer;text-decoration:none}
.hero .ctas a:hover,.hero .ctas button:hover{background:rgba(255,255,255,.26)}
.searchbar{position:relative;z-index:5;max-width:640px;margin:0 auto;display:flex;gap:8px}
.searchbar input{flex:1;min-width:0;border:none;border-radius:12px;padding:12px 18px;font-size:15px;font-family:inherit;outline:none;box-shadow:0 8px 24px rgba(0,0,0,.25)}
.searchbar input:focus{box-shadow:0 0 0 3px var(--gold),0 8px 24px rgba(0,0,0,.25)}
.searchbar button{border:none;border-radius:12px;padding:0 20px;background:var(--gold);color:#0F2540;font-weight:800;font-size:15px;cursor:pointer;font-family:inherit}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(215px,1fr));gap:14px;margin-top:18px;position:relative;z-index:5}
.card{background:var(--surface);border-radius:var(--radius);padding:18px;box-shadow:var(--shadow-l);border-top:4px solid var(--acc,#0F2540);text-decoration:none;color:var(--text);display:block;transition:transform var(--dur);position:relative}
.card:hover{transform:translateY(-3px)}
.card .icode{position:absolute;right:14px;top:12px;font-size:20px;opacity:.9;font-family:Georgia,serif}
.card h3{color:var(--navy);font-size:16px;margin-bottom:2px;padding-right:26px}
html.dark .card h3{color:var(--gold-l)}
.card .code{font-size:12px;color:var(--muted)}
.card .cnt{margin-top:8px;font-size:13px}
.card .cnt b{color:var(--acc);font-size:15px}
.bar2{height:5px;border-radius:3px;background:var(--surface-3);overflow:hidden;margin-top:7px}
.bar2 i{display:block;height:100%;background:var(--acc);border-radius:3px}
.card.dim{border-top-color:var(--border)}
.card .need{font-size:12px;color:var(--muted);margin-top:6px}
.badge-st{font-size:12px;padding:1px 8px;border-radius:9px;vertical-align:middle;margin-left:6px}
.st-active{background:color-mix(in srgb,var(--ok) 14%,var(--surface));color:var(--ok)}
.st-migrating{background:color-mix(in srgb,var(--warn) 16%,var(--surface));color:var(--warn)}
.st-pending{background:var(--surface-2);color:var(--muted)}
h1.sec,h2.sec{font-size:19px;color:var(--navy);margin:30px 0 14px;display:flex;align-items:center;gap:10px;line-height:1.4}
html.dark h1.sec,html.dark h2.sec{color:var(--gold-l)}
h1.sec::before,h2.sec::before{content:"✦";color:var(--gold)}
h2.sec{font-size:16.5px}
.ygrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:12px}
.ycard{background:var(--surface);border-radius:12px;padding:13px 8px;text-align:center;box-shadow:var(--shadow);text-decoration:none;color:var(--text);border:1px solid var(--border);transition:transform var(--dur)}
.ycard:hover{transform:scale(1.04)}
.ycard b{font-size:17px;color:var(--navy);display:block}
html.dark .ycard b{color:var(--gold-l)}
.ycard span{font-size:12px;color:var(--muted)}
.ycard.dim{opacity:.75}
.qlist{display:flex;flex-direction:column;gap:10px}
.qrow{background:var(--surface);border-radius:12px;padding:13px 18px;box-shadow:var(--shadow);text-decoration:none;color:var(--text);display:flex;gap:12px;align-items:baseline;border-left:3px solid var(--acc,#0F2540)}
.qrow .n{font-weight:800;color:var(--acc);min-width:34px;font-family:Georgia,serif}
.qrow .s{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.qrow .tag{font-size:12px;color:var(--muted);border:1px solid var(--border);padding:1px 8px;border-radius:10px;flex-shrink:0}
.qrow .rm{flex-shrink:0;font:inherit;font-size:12px;padding:2px 10px;border-radius:10px;border:1px solid var(--border);background:var(--surface);color:var(--muted);cursor:pointer}
.qrow .rm:hover{border-color:var(--bad);color:var(--bad)}
.qcard{background:var(--surface);border-radius:var(--radius);padding:22px 24px;box-shadow:var(--shadow);margin:16px 0;border-top:3px solid var(--acc,#0F2540)}
.reading{max-width:760px;margin-left:auto;margin-right:auto}
.qhead{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.qhead .qn{background:linear-gradient(135deg,var(--navy),var(--navy-mid));color:#fff;min-width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;flex-shrink:0}
.qhead .tt{font-weight:700;color:var(--navy);font-size:15px}
html.dark .qhead .tt{color:var(--gold-l)}
.qhead .ans{margin-left:auto;color:var(--ok);background:color-mix(in srgb,var(--ok) 13%,var(--surface));padding:3px 12px;border-radius:12px;font-weight:700;font-size:13.5px}
.stem{font-size:15.5px;margin-bottom:10px;white-space:pre-wrap;font-family:var(--font-read)}
.opts{margin:8px 0 14px 6px}
.opt{padding:4px 8px;border-radius:8px;font-size:14.5px;line-height:1.8;font-family:var(--font-read)}
.opt.correct{color:var(--ok);font-weight:700;background:color-mix(in srgb,var(--ok) 12%,var(--surface))}
.opt.correct::before{content:"✓ ";font-weight:800}
.selfbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:2px 0 12px}
body:not(.selftest) .selfbar{display:none}
.selfbar .sthint{font-size:12px;color:var(--muted)}
.jdres{display:none;margin:10px 0 4px;padding:9px 15px;border:1px solid var(--border);border-left:3px solid var(--navy);border-radius:10px;font-size:14px;background:var(--surface);font-family:var(--font-read)}
html.dark .jdres{border-left-color:var(--gold-l)}
article.judged .jdres{display:block}
/* 解析区块语义色（C05）：原文=中性 / 答案=绿 / 解析思路=蓝 / 警示=玫红 / 其他=中性面板 */
.blk{border-radius:var(--radius-s);padding:13px 17px;margin:12px 0;font-size:14.5px;line-height:1.95;white-space:pre-wrap;word-break:break-word;position:relative;font-family:var(--font-read)}
.blk .lab{display:block;font-weight:800;font-size:12.5px;letter-spacing:1px;margin-bottom:6px}
.blk .org{position:absolute;right:10px;top:10px;font-size:12px;color:var(--muted);border:1px solid var(--border);border-radius:8px;padding:0 6px}
.nd{margin:0 0 7px}.nd:last-child{margin-bottom:0}
.ndl{color:var(--acc);font-size:13px}
.ndcode{font-family:ui-monospace,Consolas,monospace;font-size:13.5px;background:#263238;color:#eceff1;border-radius:8px;padding:9px 12px;margin:0 0 7px;overflow-x:auto;white-space:pre}
.blk .opts{border-top:1px dashed var(--border);margin-top:9px;padding-top:9px;opacity:.72;font-size:13.5px}
.blk[data-role="stem"],.blk[data-role="material"]{background:var(--surface-2);border-left:3px solid var(--muted)}
.blk[data-role="answer"]{background:color-mix(in srgb,#2e7d32 10%,var(--surface));border-left:3px solid #2e7d32}.blk[data-role="answer"] .lab{color:#2e7d32}
.blk[data-role="approach"],.blk[data-role="think"]{background:color-mix(in srgb,var(--warn) 10%,var(--surface));border-left:3px solid var(--warn)}.blk[data-role="approach"] .lab,.blk[data-role="think"] .lab{color:var(--warn)}
.blk[data-role="analysis"],.blk[data-role="detail"]{background:color-mix(in srgb,var(--info) 8%,var(--surface));border-left:3px solid var(--info)}.blk[data-role="analysis"] .lab,.blk[data-role="detail"] .lab{color:var(--info)}
.blk[data-role="warn"],.blk[data-role="vocab"]{background:color-mix(in srgb,var(--bad) 8%,var(--surface));border-left:3px solid var(--bad)}.blk[data-role="warn"] .lab{color:var(--bad)}
.blk[data-role="nodes"],.blk[data-role="desc"],.blk[data-role="solution"],.blk[data-role="other"],.blk[data-role="frame"],.blk[data-role="kaodian"],.blk[data-role="silu"],.blk[data-role="jiefa"],.blk[data-role="biaozhun"],.blk[data-role="yicuo"],.blk[data-role="guina"],.blk[data-role="qita"],.blk[data-role="background"],.blk[data-role="qa"]{background:var(--surface-2);border:1px solid var(--border)}
html.dark .blk[data-role="answer"]{border-left-color:var(--ok)}html.dark .blk[data-role="answer"] .lab{color:var(--ok)}
html.dark .blk[data-role="analysis"] .lab,html.dark .blk[data-role="detail"] .lab{color:var(--info)}
html.dark .blk[data-role="approach"] .lab,html.dark .blk[data-role="think"] .lab{color:var(--warn)}
html.dark .blk[data-role="warn"] .lab{color:var(--bad)}
.grp{display:flex;align-items:center;gap:10px;margin:18px 0 4px;font-size:12.5px;letter-spacing:1px;color:var(--muted)}
.grp::after{content:"";flex:1;height:1px;background:var(--border)}
.grp .gtip{font-size:12px}
.blk img{max-width:100%;border-radius:8px;margin:8px 0}
.mimg{max-width:100%;height:auto;border-radius:8px;margin:8px 0;cursor:zoom-in;background:var(--surface)}
html.dark .mimg,html.dark .ppfig img,html.dark .blk img{filter:brightness(.82)}
.steps{border:1px solid var(--gold-l);border-radius:12px;padding:12px 14px;margin:14px 0;background:var(--surface)}
.steps .sthd{display:flex;flex-wrap:wrap;align-items:center;gap:8px;font-size:13px;color:var(--info);margin-bottom:8px}
.steps .sthd b{letter-spacing:1px}
html.dark .steps .sthd{color:var(--gold-l)}
.steps .org{font-size:12px;color:var(--muted);border:1px solid var(--border);border-radius:8px;padding:0 6px}
.steps .stct{margin-left:auto;color:var(--muted);font-size:12px}
.strow{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:6px}
.stp{font:inherit;font-size:12.5px;padding:3px 11px;border-radius:99px;border:1px solid var(--border);background:var(--surface);color:var(--info);cursor:pointer;transition:border-color var(--dur);font-family:var(--font-ui)}
html.dark .stp{color:var(--text)}
.stp:hover{border-color:var(--gold);background:color-mix(in srgb,var(--gold) 12%,var(--surface))}
.stp.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.stp.all{border-style:dashed}
.step{display:none;background:color-mix(in srgb,var(--info) 7%,var(--surface));border-left:3px solid var(--info);border-radius:10px;padding:11px 14px;margin:8px 0;font-size:14.5px;line-height:1.9;word-break:break-word}
.step.on{display:block;animation:fadein .22s ease-out}
.step .lab{display:block;font-weight:800;font-size:12.5px;letter-spacing:1px;color:var(--info);margin-bottom:4px}
.step p{margin:2px 0}
.stnote{font-size:12.5px;color:var(--muted)}
@keyframes fadein{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.step.on{animation:none}}

/* ============ 自测模式 v2：像一张卷子 ============
   ① 全部选项完整可见（不再隐藏正确项）② 未揭示/判分前不显示答案与解析
   ③ 卷面与揭示内容均不做颜色区分，判分反馈只用 ✓/✗ 记号
   ④ 选项可点选作答，判分计入统计，答错进错题本 */
body.selftest .qhead .ans{display:none}
body.selftest article.revealed .qhead .ans{display:inline-block;background:var(--surface);color:var(--text);border:1px solid var(--border)}
body.selftest article .opt{cursor:pointer;transition:background 120ms}
body.selftest article:not(.judged) .opt:hover{background:var(--surface-2)}
body.selftest article .opt.correct{color:inherit;background:transparent;font-weight:inherit}
body.selftest article .opt.correct::before{content:""}
body.selftest article:not(.judged) .opt.sel{background:var(--surface-3);outline:2px solid var(--navy);font-weight:700}
body.selftest article.judged .opt{cursor:default}
body.selftest article.judged .opt.hit::after{content:" ✓";font-weight:800;color:var(--navy)}
body.selftest article.judged .opt.miss::after{content:" ✗";font-weight:800;color:var(--muted)}
html.dark body.selftest article.judged .opt.hit::after{color:var(--gold-l)}
body.selftest article .blk{display:none;background:var(--surface);border:1px solid var(--border);border-left:3px solid var(--border)}
body.selftest article.revealed .blk{display:block}
body.selftest article .blk[data-role="stem"],body.selftest article .blk[data-role="material"],body.selftest article .blk[data-role="options"],body.selftest article .blk[data-role="paper_slice"],body.selftest article .blk[data-role="note"]{display:block}
body.selftest article .steps{display:none}
body.selftest article.revealed .steps{display:block}
body.selftest article .step{background:var(--surface);border:1px solid var(--border);border-left:3px solid var(--info)}
.math-raw{font-family:ui-monospace,Consolas,monospace;font-size:.92em;color:var(--muted);word-break:break-all}
.pprid{display:grid;gap:14px}
.ppfig{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:10px;box-shadow:var(--shadow)}
.ppfig img{width:100%;display:block;border-radius:8px;cursor:zoom-in;min-height:120px;background:var(--surface-2)}
.ppfig figcaption{font-size:12px;color:var(--muted);text-align:center;margin-top:6px}
.lbx{border:none;border-radius:14px;padding:14px;background:var(--surface);max-width:min(94vw,1100px)}
.lbx::backdrop{background:rgba(8,14,26,.9)}
.lbx img{max-width:100%;max-height:78vh;border-radius:10px;background:#fff;transition:transform .15s}
.lbx .lbxbar{display:flex;gap:8px;align-items:center;justify-content:center;margin-top:8px;flex-wrap:wrap}
.lbx .lbxbar button{font:inherit;padding:5px 14px;border-radius:99px;border:1px solid var(--border);background:var(--surface);color:var(--text);cursor:pointer}
.lbx .lbnote{font-size:12px;color:var(--muted)}
.figbox{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:14px 16px;margin:12px 0}
.figbox h4{font-size:14px;color:var(--navy);margin-bottom:8px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
html.dark .figbox h4{color:var(--gold-l)}
.figbox h4 .derv{font-size:12px;color:var(--warn);background:color-mix(in srgb,var(--warn) 14%,var(--surface));border-radius:8px;padding:1px 8px;font-weight:600}
.figbox canvas{display:block;margin:0 auto;max-width:100%}
.figbox .cap{font-size:12.5px;color:var(--muted);margin-top:6px}
.reveal-btn{display:block;margin:14px auto 4px;padding:9px 26px;border-radius:20px;border:1px solid var(--acc,#0F2540);background:var(--surface);color:var(--acc);font-size:14px;cursor:pointer;font-weight:700;font-family:inherit}
.reveal-btn:hover{background:var(--acc);color:#fff}
.selfbar .reveal-btn{margin:0;padding:5px 18px;font-size:13px}
.qnav{display:flex;gap:10px;justify-content:center;margin:18px 0;flex-wrap:wrap;align-items:center}

<script>
"use strict";
/* ================= 基础工具（A08/E10/E11） ================= */
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const safeURL=u=>{const s=String(u||"");if(/^(https?:|data:image\/|blob:)/i.test(s))return s;if(s.startsWith("//"))return "";return s.startsWith("/")?"":s};
const safeColor=c=>/^#[0-9a-fA-F]{3,8}$/.test(String(c||""))?c:"#0F2540";
/* 数据自带 HTML（legacy 迁移区块）：剥离脚本与事件属性（CSP 之外的第二道闸） */
function sanitizeHTML(html){return String(html??"")
  .replace(/<script[\s\S]*?<\/script>/gi,"").replace(/<\/?(iframe|object|embed|link|meta)[^>]*>/gi,"")
  .replace(/\son\w+\s*=\s*("[^"]*"|'[^']*'|[^\s>]+)/gi,"").replace(/javascript:/gi,"")}
let CACHE=new Map(),toastTimer=null,keyHandler=null,RENDER_SEQ=0;
function cacheSet(k,v){if(CACHE.size>80){const f=CACHE.keys().next().value;CACHE.delete(f)}CACHE.set(k,v)}
const app=$("#app");
function toast(m,sticky){const t=$("#toast");t.textContent=m;t.style.display="block";clearTimeout(toastTimer);
  if(!sticky)toastTimer=setTimeout(()=>t.style.display="none",2600)}
function logErr(scope,msg){try{const a=JSON.parse(localStorage.getItem("kyl:errlog")||"[]");
  a.unshift({t:new Date().toISOString(),scope:String(scope).slice(0,40),msg:String(msg).slice(0,300),hash:location.hash.slice(0,60)});
  localStorage.setItem("kyl:errlog",JSON.stringify(a.slice(0,20)))}catch(e){}}
window.onerror=function(m){logErr("onerror",m);const e=$("#errbar");e.style.display="block";
  e.innerHTML="⚠ 脚本错误："+esc(String(m))+"（其他模块不受影响，<a href='diag.html' style='color:#fff'>自诊断</a>）";
  setTimeout(()=>e.style.display="none",8000);return false};
addEventListener("unhandledrejection",e=>logErr("promise",e.reason||"unhandled rejection"));
function ls(k,v){try{if(v===undefined)return localStorage.getItem(k);localStorage.setItem(k,v)}catch(e){return null}}
function lsd(k){try{localStorage.removeItem(k)}catch(e){}}
function hexBytes(h){const a=new Uint8Array(h.length/2);for(let i=0;i<a.length;i++)a[i]=parseInt(h.substr(i*2,2),16);return a}
function b64Bytes(b){const bin=atob(b);const a=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)a[i]=bin.charCodeAt(i);return a}

/* ================= 网络层（E05/E06）：重试 + LRU 缓存 ================= */
const wait=ms=>new Promise(r=>setTimeout(r,ms));
async function fetchJSON(url){
  if(CACHE.has(url))return CACHE.get(url);
  let lastErr=null;
  for(let a=0;a<3;a++){
    const ac=new AbortController();const tid=setTimeout(()=>ac.abort(),15000);
    try{
      const r=await fetch(url,{signal:ac.signal});
      if(r.status===404)throw Object.assign(new Error("HTTP 404"),{fatal:true});
      if(!r.ok)throw new Error("HTTP "+r.status);
      const j=await r.json();cacheSet(url,j);return j;
    }catch(e){
      if(e&&e.fatal)throw e;
      lastErr=e;
      if(a<2)await wait(400*Math.pow(3,a));
    }finally{clearTimeout(tid)}
  }
  throw lastErr||new Error("网络错误");
}

/* ================= 内容加密层（合规：口令解锁，AES-256-GCM） ================= */
const ENC={manifest:null,key:null,enabled:false};
async function encInit(){
  try{
    const r=await fetch("enc/manifest.json",{cache:"no-cache"});
    if(!r.ok)return;
    ENC.manifest=await r.json();ENC.enabled=true;
  }catch(e){/* 未加密模式（本地开发） */}
}
async function deriveKey(pass){
  const{kdf,verify}=ENC.manifest;
  const km=await crypto.subtle.importKey("raw",new TextEncoder().encode(pass),"PBKDF2",false,["deriveKey"]);
  const key=await crypto.subtle.deriveKey({name:"PBKDF2",salt:hexBytes(kdf.salt),iterations:kdf.iter,hash:"SHA-256"},
    km,{name:"AES-GCM",length:kdf.bits||256},false,["decrypt"]);
  const pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:hexBytes(verify.iv)},key,b64Bytes(verify.ct));
  if(new TextDecoder().decode(pt)!=="kaoyan-lab-v1")throw new Error("口令校验失败");
  return key;
}
async function tryPass(p){ENC.key=await deriveKey(p);ls("kyl:pass",p)}
function lockScreen(){
  return new Promise(res=>{
    const d=document.createElement("div");d.className="lock";
    d.innerHTML=`<div class="box"><h2>🔒 个人学习库</h2>
      <p>内容已加密 · 请输入访问口令<br>口令保存在本地后下次自动解锁</p>
      <input id="lock-in" type="password" autocomplete="current-password" aria-label="访问口令">
      <button id="lock-go" type="button">解锁</button><div class="er" id="lock-er"></div></div>`;
    document.body.appendChild(d);
    const inp=d.querySelector("#lock-in"),er=d.querySelector("#lock-er");
    const go=async()=>{
      try{await tryPass(inp.value);d.remove();res()}
      catch(e){er.textContent="口令不正确，请重试";inp.select()}
    };
    d.querySelector("#lock-go").onclick=go;
    inp.onkeydown=e=>{if(e.key==="Enter")go()};
    setTimeout(()=>inp.focus(),50);
  });
}
async function ensureUnlocked(){
  if(!ENC.enabled||ENC.key)return;
  const saved=ls("kyl:pass");
  if(saved){try{await tryPass(saved);return}catch(e){lsd("kyl:pass")}}
  await lockScreen();
}
async function decBlob(ivHex,buf){
  return crypto.subtle.decrypt({name:"AES-GCM",iv:hexBytes(ivHex)},ENC.key,buf);
}
async function getContent(path){
  if(CACHE.has(path))return CACHE.get(path);
  if(ENC.enabled&&ENC.manifest&&ENC.manifest.files[path]){
    await ensureUnlocked();
    const info=ENC.manifest.files[path];
    let buf=null,lastErr=null;
    for(let a=0;a<2;a++){try{buf=await(await fetch("enc/"+info.f)).arrayBuffer();break}catch(e){lastErr=e;await wait(500)}}
    if(!buf)throw lastErr||new Error("密文下载失败");
    const pt=await decBlob(info.iv,buf);
    const j=JSON.parse(new TextDecoder().decode(pt));
    cacheSet(path,j);return j;
  }
  return fetchJSON(path);
}
/* 路径型图片（原卷影像页）在加密模式经 blob URL 水合；data URI 直接可用 */
async function mediaSrcFor(p){
  const s=safeURL(p);
  if(!s)return "";
  if(!ENC.enabled||/^(data:|blob:)/.test(s))return s;
  if(ENC.manifest&&ENC.manifest.files[s]){
    await ensureUnlocked();
    const info=ENC.manifest.files[s];
    const buf=await(await fetch("enc/"+info.f)).arrayBuffer();
    const pt=await decBlob(info.iv,buf);
    return URL.createObjectURL(new Blob([pt],{type:/\.jpe?g$/i.test(s)?"image/jpeg":/\.png$/i.test(s)?"image/png":"image/webp"}));
  }
  return s;
}
let _io=null;
function hydrateImgs(scope){
  const imgs=scope.querySelectorAll("img[data-encsrc]");
  if(!imgs.length)return;
  if(!ENC.enabled){imgs.forEach(im=>im.src=im.dataset.encsrc);return}
  if(!_io)_io=new IntersectionObserver(es=>{
    es.forEach(en=>{if(!en.isIntersecting)return;_io.unobserve(en.target);
      mediaSrcFor(en.target.dataset.encsrc).then(u=>{if(u)en.target.src=u})
        .catch(()=>{en.target.alt="图片解密失败（检查口令或网络）"})});
  },{rootMargin:"300px"});
  imgs.forEach(im=>_io.observe(im));
}

/* ================= 本地学习数据（B01/B02/B03/B05/B07） ================= */
function statsOf(sid){try{return JSON.parse(ls("st:"+sid))||{a:0,c:0}}catch(e){return{a:0,c:0}}}
function bumpStat(sid,ok){const s=statsOf(sid);s.a++;if(ok)s.c++;ls("st:"+sid,JSON.stringify(s))}
function rollbackStat(sid,ok){const s=statsOf(sid);s.a=Math.max(0,s.a-1);if(ok)s.c=Math.max(0,s.c-1);ls("st:"+sid,JSON.stringify(s))}
function markWrong(qid,bad){
  if(!bad){lsd("wrong:"+qid);return}
  const m=qid.match(/^(.+?)-(\d{4})-(\d+)$/);
  const s=m?subjById(m[1]):null;
  const label=m?`${s?(s.short||s.name):m[1]} ${m[2]} 第 ${+m[3]} 题`:qid;
  ls("wrong:"+qid,JSON.stringify({label,ref:`#/${m?m[1]:""}/${m?+m[2]:0}/q/${m?+m[3]:1}`}));
}
function kvList(prefix){const out=[];try{
  for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);
    if(k&&k.startsWith(prefix))out.push(k.slice(prefix.length))}
}catch(e){}return out}
function wrongList(){return kvList("wrong:").map(qid=>{try{const v=JSON.parse(ls("wrong:"+qid));return{qid,label:v.label||qid,ref:v.ref}}catch(e){return null}}).filter(Boolean)}
function bookmarkList(){return kvList("bm:").filter(k=>ls("bm:"+k)==="1").map(qid=>{const m=qid.match(/^(.+?)-(\d{4})-(\d+)$/);
  const s=m?subjById(m[1]):null;
  return{qid,label:m?`${s?(s.short||s.name):m[1]} ${m[2]} 第 ${+m[3]} 题`:qid,ref:m?`#/${m[1]}/${+m[2]}/q/${+m[3]}`:"#/"}})}
function hintTotal(){return kvList("hint:").reduce((a,k)=>a+(+ls("hint:"+k)||0),0)}

/* ================= 公式引擎（E02 惰性加载 / E08 白名单解析器 / A01 样式已入 head） ================= */
let _katexP=null;
function ensureKatex(){
  if(window.renderMathInElement)return Promise.resolve();
  if(_katexP)return _katexP;
  _katexP=new Promise((res,rej)=>{
    const s=document.createElement("script");s.src="vendor/katex/katex.min.js";s.defer=true;
    s.onload=()=>{const s2=document.createElement("script");s2.src="vendor/katex/contrib/auto-render.min.js";s2.defer=true;
      s2.onload=()=>res();s2.onerror=()=>{_katexP=null;rej(new Error("auto-render 加载失败"))};document.head.appendChild(s2)};
    s.onerror=()=>{_katexP=null;rej(new Error("KaTeX 加载失败"))};
    document.head.appendChild(s);
  });
  return _katexP;
}
/* E08：递归下降解析器替代 new Function，CSP 不再需要 unsafe-eval */
function makeExprFn(src){
  const toks=[];const s=String(src||"");
  const re=/\s*(?:(\d+(?:\.\d+)?)|([A-Za-z_]+)|([-+*/^(),]))/y;let i=0;
  while(i<s.length){re.lastIndex=i;const m=re.exec(s);
    if(!m)throw new Error("非法字符:"+(s[i]||"EOF"));
    i=re.lastIndex;
    if(m[1]!==undefined)toks.push({t:"num",v:parseFloat(m[1])});
    else if(m[2]!==undefined)toks.push({t:"id",v:m[2]});
    else toks.push({t:m[3]});}
  let p=0;
  const FN={sin:Math.sin,cos:Math.cos,tan:Math.tan,asin:Math.asin,acos:Math.acos,atan:Math.atan,
    sinh:Math.sinh,cosh:Math.cosh,tanh:Math.tanh,ln:Math.log,log:Math.log,log10:Math.log10,
    exp:Math.exp,sqrt:Math.sqrt,abs:Math.abs,floor:Math.floor,ceil:Math.ceil,min:Math.min,max:Math.max};
  const CONST={pi:Math.PI,e:Math.E};
  const peek=()=>toks[p];
  const eat=t=>{const k=toks[p];if(!k||k.t!==t)throw new Error("语法错误@"+p);p++;return k};
  function parseE(){let l=parseT();while(peek()&&(peek().t==="+"||peek().t==="-")){const op=eat(peek().t).t;const r=parseT();
    l=(op==="+")?((x,t)=>l(x,t)+r(x,t)):((x,t)=>l(x,t)-r(x,t))}return l}
  function parseT(){let l=parseU();while(peek()&&(peek().t==="*"||peek().t==="/")){const op=eat(peek().t).t;const r=parseU();

function renderAnswerHTML(ans){
  const s=String(ans??"");

  const CJK=/([\u3000-\u303f\u3400-\u9fff\uf900-\ufaff\uff00-\uffef]+)/g;
  const tryMath=seg=>{if(!seg.trim())return null;
    try{return katex.renderToString(seg,{throwOnError:true,displayMode:false})}catch(e){return null}};
  let out="",last=0,m;
  while((m=CJK.exec(s))){
    const seg=s.slice(last,m.index);
    if(seg.trim()){const h=tryMath(seg);out+=h!=null?h:esc(seg)}
    out+=esc(m[0]);last=m.index+m[0].length;
  }
  const tail=s.slice(last);

function prevText(t,n){

  return s;
}
function pairSlice(t,center,before,after){
  t=String(t||"").replace(/\s+/g," ");
  const a=Math.max(0,center-before);
  let seg=t.slice(a,Math.min(t.length,center+after));
  let guard=0;
  while(((seg.match(/\$/g)||[]).length)%2&&guard++<4){
    const iLast=seg.lastIndexOf("$"),iFirst=seg.indexOf("$");
    if(iLast<(center-a))seg=seg.slice(iFirst+1);else seg=seg.slice(0,iLast);

  return seg;
}

function renderFigure(host,spec){

  const dark=document.documentElement.classList.contains("dark");
  const px=x=>44+(x-xlim[0])/(xlim[1]-xlim[0])*(W-60);
  const py=y=>H-26-(y-ylim[0])/(ylim[1]-ylim[0])*(H-48);

  ctx.fillStyle="#94a3b8";ctx.font="10px sans-serif";ctx.textAlign="center";

  ctx.textAlign="right";
  for(let i=0;i<=8;i+=2){const y=ylim[0]+gy*i;if(Math.abs(y)>1e-9)ctx.fillText(String(+y.toFixed(2)),38,py(y)+3);}
  const PALETTE=["#1D4ED8","#B8324A","#1F7A6D","#7C3AED","#C9A961","#0F2540"];

    const N=Math.min(700,Math.max(300,W)),span=xlim[1]-xlim[0];
    for(let i=0;i<=N;i++){const x=x0+(x1-x0)*i/N;const y=fn(x);
      if(!isFinite(y)||y<ylim[0]-span*2||y>ylim[1]+span*2){pen=false;continue}
      const X=px(x),Y=py(y);if(!pen){ctx.moveTo(X,Y);pen=true}else ctx.lineTo(X,Y);}

  const fillBetween=(f1,f2,x0,x1,color)=>{const A=safe(f1),B=safe(f2);if(!A||!B)return;
    ctx.fillStyle=color;ctx.beginPath();let first=true;const N=400;

    for(let i=N;i>=0;i--){const x=x0+(x1-x0)*i/N;const y=B(x);if(!isFinite(y))continue;ctx.lineTo(px(x),py(y));}
    ctx.closePath();ctx.fill();};
  (spec.items||[]).forEach(it=>{
    const col=it.color||PALETTE[(ci++)%PALETTE.length];
    switch(it.kind){

      case "shade_between":fillBetween(it.f1,it.f2,+(it.domain?it.domain[0]:xlim[0]),+(it.domain?it.domain[1]:xlim[1]),it.color||"rgba(29,78,216,.18)");break;
      case "shade_under":fillBetween(it.f,"0",+(it.domain?it.domain[0]:xlim[0]),+(it.domain?it.domain[1]:xlim[1]),it.color||"rgba(29,78,216,.18)");break;

      case "vline":{ctx.strokeStyle=col||"#94a3b8";ctx.setLineDash(it.style==="dashed"?[5,4]:[]);ctx.beginPath();

      case "hline":{ctx.strokeStyle=col||"#94a3b8";ctx.setLineDash(it.style==="dashed"?[5,4]:[]);ctx.beginPath();

}

/* ================= 九段式分步揭示（F03） ================= */
const STEPS=[["考点定位","kaodian"],["先补基础","basis"],["审题抓条件","read"],["思路引导","silu"],
  ["关键一步","key"],["完整推导","derive"],["为什么不选其他","why"],["易错深挖","yicuo"],["举一反三","fan"]];
const STEP_MARK=["①","②","③","④","⑤","⑥","⑦","⑧","⑨"];
const STEP_ALIAS={"书写套路/评分点":"derive","书写套路":"derive","方法归纳":"yicuo","其他解法":"fan",
  "解法构建":"key","标准解答":"derive","易错提醒":"yicuo","逐项解析":"why","详细解析":"derive","怎么想":"silu"};
function buildSteps(ana){
  if(!ana||!Array.isArray(ana.nodes)||!ana.nodes.length)return "";
  const bucket={},order=[];let last="derive";
  ana.nodes.forEach(n=>{
    const lb=n.label?String(n.label).trim():null;
    let key=null;
    if(lb){const hit=STEPS.find(x=>x[0]===lb);key=hit?hit[1]:(STEP_ALIAS[lb]||null)}
    if(!key)key=last;else if(!bucket[key])last=key;
    if(!bucket[key]){bucket[key]=[];order.push(key)}
    (n.lines||[]).forEach(l=>bucket[key].push(String(l)));
  });
  const present=STEPS.filter(x=>bucket[x[1]]&&bucket[x[1]].length);
  if(!present.length)return "";
  const idx=k=>STEPS.findIndex(x=>x[1]===k);
  const row=present.map(x=>`<button class="stp" data-k="${x[1]}" aria-expanded="false" aria-controls="step-${x[1]}">${STEP_MARK[idx(x[1])]} ${esc(x[0])}</button>`).join("");
  const body=present.map(x=>`<div class="step" id="step-${x[1]}" data-k="${x[1]}"><span class="lab">${STEP_MARK[idx(x[1])]} ${esc(x[0])}</span>`+
    bucket[x[1]].map(l=>`<p>${esc(l)}</p>`).join("")+`</div>`).join("");
  return `<div class="steps" id="steps"><div class="sthd"><b>扩展精讲 · ${present.length===9?"九段式":"分步"}揭示（本题 ${present.length} 段）</b><span class="org">非原文 · 平台扩展</span>`+
    `<span class="stct">已揭示 <b id="stn">0</b>/${present.length}</span>`+
    `<button class="stp all" id="stall">全部揭示</button></div><div class="strow">${row}</div>${body}`+
    (ana.desc?`<div class="stnote">一句话要点：${esc(ana.desc)}</div>`:"")+`</div>`;
}

function optLetter(o){const s=String(o);const m=s.match(/^\s*(?:\[?([A-H])\]?|[（(]([A-H])[）)]|([A-H])[\.、\s])/);return m?(m[1]||m[2]||m[3]):null}
const GRP_ORIGINAL=new Set(["stem","material","options","paper_slice","note"]);
async function viewQuestion(seq,s,y,num){
  setMeta(`${y} 年 ${s.short||s.name} 第 ${num} 题`,`${s.name} ${y} 年第 ${num} 题真题与逐题解析。`);
  RENDER_MODE=isMathSid(s.id)?"full":"safe";
  let d;
  try{d=await getContent(`data/${dirOf(s.id)}/${y}.json`)}catch(e){app.innerHTML=`<div class="qcard">加载失败：${esc(e.message)} <button class="reveal-btn" style="margin:0" onclick="location.reload()">↻ 重试</button></div>`;return}
  if(!alive(seq))return;
  const qs=d.questions||[];const idx=qs.findIndex(q=>q.num===num);
  if(idx<0){app.innerHTML=`<div class="qcard">未找到第 ${num} 题。<a href="#/${s.id}/${y}">返回列表</a></div>`;return}
  const q=qs[idx];
  ls("kyl:last",JSON.stringify({sid:s.id,year:y,num:q.num}));
  let mediaMap=null;
  if(JSON.stringify(q).includes("@@M:")){try{mediaMap=(await getContent(`data/${dirOf(s.id)}/${y}.media.json`)).items||{}}catch(e){}}
  let ana=null;
  if((s.analysisYears||[]).includes(y))
  try{const ad=await getContent(`data/${dirOf(s.id)}/${y}.analysis.json`);
    ana=(ad.analysis||[]).find(a=>a.id===q.id)||null}catch(e){}
  let paperLink="";
  try{const mp=await getContent("data/meta/source_pdfs.json");
    if(!alive(seq))return;
    const kk=paperKeys(mp,s.id,y);
    if(kk.length)paperLink=`<a href="#/${s.id}/${y}/paper">原卷影像对照（${(mp[kk[0]].page_files||[]).length} 页）</a>`;
  }catch(e){}
  const fill=t=>String(t??"").replace(/@@M:([-\w]+):(\d+)@@/g,(m0,id,i)=>{
    const uri=mediaMap&&mediaMap[id]&&mediaMap[id][i];
    return uri?`<img src="${esc(safeURL(uri))}" alt="题目配图" loading="lazy" class="mimg">`:m0;});
  const fillText=t=>String(t??"").split(/(@@M:[-\w]+:\d+@@)/g).map(seg=>{
    const m=seg.match(/^@@M:([-\w]+):(\d+)@@$/);
    if(!m)return esc(seg);
    const uri=mediaMap&&mediaMap[m[1]]&&mediaMap[m[1]][m[2]];
    return uri?`<img src="${esc(safeURL(uri))}" alt="题目配图" loading="lazy" class="mimg">`:esc(seg);
  }).join("");
  const ansStr=q.answer==null?"":(typeof q.answer==="object"?JSON.stringify(q.answer):String(q.answer));
  const correct=new Set((ansStr.match(/[A-H]/g)||[]));
  const optArr=q.options||[];
  const isChoice=optArr.length>0;
  const positional=optArr.length>0&&!optArr.some(o=>optLetter(typeof o==="object"?JSON.stringify(o):String(o)));
  const opts=optArr.map((o,i)=>{
    const obj=typeof o==="object"?JSON.stringify(o):String(o);
    const L=positional?String.fromCharCode(65+i):optLetter(obj);
    const shown=positional?`${L}. ${obj}`:obj;
    return `<div class="opt"${L?` data-l="${L}"`:""}${L&&correct.has(L)?" correct":""} role="${q.type==="multi"?"checkbox":"radio"}" aria-checked="false">${fillText(shown)}</div>`;}).join("");
  const nodeBlock=txt=>{
    if(typeof txt!=="string"||txt.trim().charAt(0)!=="[")return null;
    let arr;try{arr=JSON.parse(txt)}catch(e){return null}
    if(!Array.isArray(arr)||!arr.length||!arr.every(n=>n&&typeof n==="object"))return null;
    return arr.map(n=>{
      const lines=(n.lines||[]).map(l=>esc(String(l))).join("<br>");
      if(n.type==="code")return `<pre class="ndcode">${(n.lines||[]).map(l=>esc(String(l))).join("\n")}</pre>`;
      const lab=n.label?`<b class="ndl">${esc(String(n.label))}</b> `:"";
      return `<div class="nd">${lab}${lines}</div>`;
    }).join("");
  };

  if(!sel.length)sel=act.map(s=>s.id);
  app.innerHTML=`<nav class="crumb" aria-label="面包屑"><a href="#/">首页</a> › 搜索</nav>
  <h1 class="sec">跨科搜索</h1>
  <div class="searchbar" style="margin:10px 0 4px"><input id="q2" value="${esc(q)}" placeholder="输入关键词…（题干/解析/考点）" aria-label="搜索关键词"><button id="go2">搜索</button></div>
  <div class="chips" role="group" aria-label="按科目筛选">${act.map(s=>`<button class="chip${sel.includes(s.id)?" on":""}" data-sid="${s.id}" aria-pressed="${sel.includes(s.id)}" style="--acc:${safeColor(s.color)}">${esc(s.short||s.name)}</button>`).join("")}</div>
  <div id="res" aria-live="polite" aria-busy="false"><div class="qcard">输入关键词开始搜索…</div></div>`;
  $("#go2").onclick=()=>{const v=$("#q2").value.trim();location.hash="#/search/"+encodeURIComponent(v)};
  $("#q2").onkeydown=e=>{if(e.key==="Enter")$("#go2").click()};
  $("#q2").focus();
  app.querySelectorAll(".chip").forEach(ch=>ch.onclick=()=>{
    const id=ch.dataset.sid;sel=sel.includes(id)?sel.filter(x=>x!==id):sel.concat(id);
    ls("searchSids",sel.join(","));ch.classList.toggle("on");ch.setAttribute("aria-pressed",ch.classList.contains("on"));if(q)run();
  });
  let runId=0;
  function score(e,kw){
    let sc=1;
    if((e.title||"").toLowerCase().includes(kw))sc+=3;
    if((e.tags||[]).some(t=>String(t).toLowerCase().includes(kw)))sc+=2;
    return sc;
  }
  function renderHits(agg,kw,done,loaded,total){
    const res=$("#res");if(!res||!alive(seq))return;
    res.setAttribute("aria-busy",done?"false":"true");
    agg.sort((a,b)=>score(b,kw)-score(a,kw)||(sel.indexOf(a.sid)-sel.indexOf(b.sid))||(a.year-b.year)||(a.num-b.num));
    const hits=agg.slice(0,80);
    const head=`<div style="font-size:12.5px;color:var(--muted);margin:10px 0 4px">命中 ${agg.length} 条${agg.length>80?"（按相关度显示前 80）":""} · 已加载 ${loaded}/${total} 科${done?"":" · 检索中…"}</div>`;
    if(!hits.length){res.innerHTML=head+`<div class='qcard'>${done?"无结果。试试更短的关键词，或 <button class='chip' id='allsub'>在全部分科中搜</button>。":"检索中…"}</div>`;
      const b=$("#allsub");if(b)b.onclick=()=>{sel=act.map(s=>s.id);ls("searchSids","");app.querySelectorAll(".chip").forEach(c=>{c.classList.add("on");c.setAttribute("aria-pressed","true")});run()};
      return}
    const hl=t=>{
      t=String(t||"");
      const i=t.toLowerCase().indexOf(kw);
      if(kw&&i>=0){const seg=pairSlice(t,i,40,90);
        const j=seg.toLowerCase().indexOf(kw);
        if(j>=0)return esc(seg.slice(0,j))+"<mark>"+esc(seg.slice(j,j+kw.length))+"</mark>"+esc(seg.slice(j+kw.length))+(i+90<t.length?"…":"");
        return esc(seg);}
      return esc(t.slice(0,130));
    };
    res.innerHTML=head+hits.map(e=>{
      const s=subjById(e.sid);const snippet=hl(e.text||e.title);
      return `<a class="sr" style="--acc:${s?safeColor(s.color):"#999"}" href="#/${e.sid}/${e.year}/q/${e.num}">
        <div class="h">${esc(s?s.short:e.sid)} ${e.year} 第 ${e.num} 题 <span style="font-weight:400;font-size:12px;color:var(--muted)">${esc(TYPE_LABEL[e.type]||"")}</span></div>
        <div class="m">${snippet}</div></a>`;}).join("");
    renderMath(res,"safe");
  }
  async function run(){
    const my=++runId;
    if(!alive(seq))return;
    const res=$("#res");if(res)res.innerHTML="<div class='qcard'>检索中…</div>";
    const kw=q.toLowerCase();const agg=[];let loaded=0;const total=sel.length;
    for(const sid of sel){
      getContent(`data/index/${sid}.json`).then(ix=>{
        if(my!==runId)return;
        ((ix&&ix.entries)||[]).forEach(e=>{
          if(!kw||(e.title||"").toLowerCase().includes(kw)||(e.text||"").toLowerCase().includes(kw))agg.push(e);
        });
        loaded++;renderHits(agg,kw,loaded>=total,loaded,total);
      }).catch(()=>{loaded++;if(my===runId)renderHits(agg,kw,loaded>=total,loaded,total)});
    }
  }
  if(q)run();
  onkeys(e=>{if(e.key==="/"){e.preventDefault();$("#q2").focus()}});
}

/* ================= 键盘管理（D04/D05） ================= */
function onkeys(fn){keyHandler=fn}
addEventListener("keydown",e=>{
  if(e.key==="?"){e.preventDefault();$("#dlg-keys").showModal();return}
  if(e.key==="/"){
    if(/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName))return;
    e.preventDefault();
    if(location.hash.replace(/^#\/?/,"").split("/")[0]==="search"&&$("#q2"))$("#q2").focus();
    else location.hash="#/search/";
    return;
  }
  const ae=document.activeElement;
  if(keyHandler&&ae&&!/INPUT|TEXTAREA|SELECT/.test(ae.tagName)&&!(ae.closest&&ae.closest("button,a,summary,[role=switch],[role=button]")))keyHandler(e);
});
addEventListener("scroll",()=>{$("#backtop").classList.toggle("show",scrollY>600)},{passive:true});
$("#backtop").onclick=()=>scrollTo({top:0,behavior:"smooth"});

/* ================= 自测开关（D02） ================= */
function setSelftest(on){
  document.body.classList.toggle("selftest",on);
  $("#selftest").setAttribute("aria-checked",on?"true":"false");
  ls("selftest",on?"1":"0");
}
$("#selftest").onclick=function(){
  const on=!document.body.classList.contains("selftest");
  setSelftest(on);
  toast(on?"自测模式开启：完整卷面，点选作答、判分计分":"自测模式关闭：显示答案与颜色标记");
};
$("#keys-ok").onclick=()=>$("#dlg-keys").close();
function view404(){app.innerHTML=`<h1 class="sec">404</h1><div class="qcard">页面或科目不存在（未上线科目需先提供资料）。<a href="#/">回到首页</a></div>`}

/* ================= 启动（B15：失败给重试，不放假数据） ================= */
(async function boot(){
  applyTheme();
  setSelftest(ls("selftest")==="1");
  await encInit();
  await ensureUnlocked();
  try{REG=await getContent("data/meta/subjects.json")}
  catch(e){
    app.innerHTML=`<div class="qcard" style="text-align:center"><h1 class="sec" style="justify-content:center">科目注册表加载失败</h1>
      <p style="color:var(--muted);font-size:14px">${esc(e.message)}${ENC.enabled?"（密文下载或解密失败，可检查口令）":""}</p>
      <button class="reveal-btn" onclick="location.reload()">↻ 重试</button></div>`;
    logErr("boot",e.message);return;
  }
  const ft=$("#ftver");
  if(ft)ft.textContent="内容版本 "+String(REG.updated_at||"").slice(0,10)+" · "+(REG.subjects||[]).length+" 科 · "+(REG.subjects||[]).reduce((a,s)=>a+(s.questionTotal||0),0)+" 题";
  buildSubNav();
  route();
})();
function buildSubNav(){
  const sel=$("#subsel");
  if(!sel||!REG)return;
  const groups={"可刷题":[],"影像在库":[],"规划中":[]};
  (REG.subjects||[]).forEach(s=>{
    if(s.status==="active")groups["可刷题"].push(s);
    else if(s.status==="pending")groups["规划中"].push(s);
    else groups["影像在库"].push(s);
  });
  sel.innerHTML=`<option value="" disabled selected>切换科目…</option>`+
    Object.entries(groups).filter(([,a])=>a.length).map(([g,arr])=>
      `<optgroup label="${g}">`+arr.map(s=>`<option value="${s.id}">${esc(s.short||s.name)}${s.status==="pending"?"（未收录）":""}</option>`).join("")+`</optgroup>`).join("");
  sel.onchange=()=>{if(sel.value)location.hash="#/"+sel.value};
}
</script>
<script>
if("serviceWorker" in navigator){
  addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));
  /* A11：首次安装不刷新；更新只提示不打断 */
  let _had=!!navigator.serviceWorker.controller;
  navigator.serviceWorker.addEventListener("controllerchange",()=>{
    if(!_had){_had=true;return}
    toast("📄 新版本已就绪，刷新页面后生效（不会打断当前内容）",true);
  });
}
</script>
